<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Asistenti Digjital</title>

  <style>
      /* BODY – lejon scroll */
      body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #07162e;
          min-height: 100vh;
          overflow-y: auto;
      }

      /* Overlay – CENTER */
      #overlay {
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
      }

      /* New Chat Button */
      #newChat {
          position: fixed;
          top: 20px;
          left: 20px;
          background: #0b2a5a;
          color: white;
          border: none;
          padding: 14px 20px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 16px;
          z-index: 10;
      }
      #newChat:hover {
          background: #12408a;
      }

      /* Credit */
      #credit {
          position: fixed;
          bottom: 15px;
          right: 20px;
          font-size: 14px;
          color: #b5c7e3;
      }

      /* Chat box – gjithmonë në mes */
      #chat {
          width: 900px;
          max-width: 90vw;
          background: #0b1f3f;
          padding: 25px;
          border-radius: 14px;
          box-shadow: 0 0 40px rgba(0,0,0,0.5);
          color: white;
          display: flex;
          flex-direction: column;
      }

      /* Title */
      #chat h3 {
          font-size: 26px;
          margin-bottom: 15px;
      }

      /* Messages – scroll brenda */
      #messages {
          flex: 1;
          background: #1d3f75;
          border-radius: 10px;
          padding: 18px;
          overflow-y: auto;
          margin-bottom: 15px;
          font-size: 18px;
      }

      /* Messages style */
      .user { color: #4da3ff; margin: 10px 0; }
      .bot { color: #ffffff; margin: 10px 0; }
      .thinking { color: #ccc; font-style: italic; }

      /* Input */
      #input {
          width: 100%;
          padding: 16px;
          font-size: 18px;
          border-radius: 10px;
          border: none;
          outline: none;
          background: #102a52;
          color: white;
      }
      #input::placeholder {
          color: #9fb6dd;
      }
  </style>
</head>

<body>

<button id="newChat">🔄 Bisedë e re</button>
<div id="credit">Krijuar nga nxënësit dhe mësueset e shkollës Lasgush Poradeci</div>

<div id="overlay">
  <div id="chat">
    <h3>Asistenti Digjital 🤖</h3>
    <div id="messages"></div>
    <input id="input" placeholder="Çfarë do të dish?" autocomplete="off">
  </div>
</div>

<script>
  let hapi = 0;

  const input = document.getElementById("input");
  const messages = document.getElementById("messages");
  const newChat = document.getElementById("newChat");

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  newChat.onclick = () => {
    messages.innerHTML = "";
    hapi = 0;
    bot("Përshëndetje! Çfarë gjuhe preferon?");
  };

  window.onload = () => {
    bot("Përshëndetje! Çfarë gjuhe preferon?");
  };

  function bot(text) {
    const div = document.createElement("div");
    div.className = "bot";
    div.innerHTML = "<b>Asistenti Digjital:</b><br>" + text.replace(/\n/g,"<br>");
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function user(text) {
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = "<b>Ti:</b> " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function eshteNgjarjeSot(text) {
    const fjalet = ["sot","më ndodhi","me ndodhi","isha","pata","bëra","bera"];
    return fjalet.some(f => text.toLowerCase().includes(f));
  }

  function pergjigjeSintakse(text) {
    text = text.toLowerCase();

    if (text.includes("kryefjala"))
      return "Kryefjala është gjymtyra kryesore e fjalisë që shënon frymorin a sendin i cili kryen veprimin ose që ka tiparin e shprehur nga kallëzuesi.\n" +
        "\n" +
        "Kryefjala shprehet:\n" +
        "a) me emër – Shiu vazhdonte të binte lehtë e gëzueshëm.\n" +
        "b) me përemër – Lirinë nuk ua solla unë, po e gjeta në mes jush.\n" +
        "c) me grup emëror – Midis reve, herë pas here ndriçonte tokën dielli pranveror.\n" +
        "d) me pjesë të nënrenditur ftilluese – Mendohet se ky qytet është një vendbanim i lashtë.\n";

    if (text.includes("kallëzuesi") || text.includes("kallezuesi"))
      return "1) Ç’është kallëzuesi?\n" +
        "Kallëzuesi është gjymtyra kryesore e fjalisë që tregon një veprim a një gjendje të kryefjalës.\n" +
        "Klasifikimi i kallëzuesve sipas mënyrës së shprehjes:\n" +
        "⦁\tKallëzues emëror – Ai është njeri i besës.\n" +
        "Mënyra e formimit: folja ‘jam/është- këpuja’  + gjymtyra emërore ‘njeri i besës’ (GE).\n" +
        "⦁\tKallëzues i thjeshtë foljor – Drita e mëngjesit po mbulonte tokën e përgjumur.\n" +
        "Mënyra e formimit: folje në kohët e thjeshta ose kohë të përbëra.\n" +
        "⦁\tKallëzues i përbërë foljor – Ajo filloi të shkruante librin e parë.\n" +
        "Mënyra e formimit: \n" +
        "⦁\tfolje aspektore që tregojnë fillim, vazhdim, mbarim të veprimit (filloj, zë, nis, vazhdoj, vijoj, mbaroj, përfundoj…) ose folje modale (mund, duhet, do).\n" +
        "⦁\tpasohet nga një tjetër folje në lidhore (të shkruante), forma të pashtjelluara ose emra prejfoljor asnjanës.\n";

    if (text.includes("kundrinori"))
      return "Kundrinori tregon mbi kë ose mbi çfarë bie veprimi.";

    if (text.includes("përcaktori") || text.includes("percaktori"))
      return "Përcaktori është gjymtyrë e dytë e fjalisë, pjesë e grupit emëror.\n" +
        "Llojet e përcaktorëve - mënyrat e shprehjes.\n" +
        "Përcaktori me përshtatje - përshtatet me emrin bërthamë në gjini, numër, rasë.\n" +
        "Shprehet:\n" +
        "a) me mbiemër – Uji po rridhte me një zhurmë ritmike.\n" +
        "b) me përemër – Motra e saj fliste aq bukur!\n" +
        "c) me numëror – Ata janë tre shokë të mirë.\n" +
        "Përcaktori me drejtim\n" +
        "Shprehet:\n" +
        "a)\tMe emër në rasën emërore me parafjalë - Vajza nga Tirana fitoi vendin e parë në konkurs.\n" +
        "b)\tMe emër në rasën gjinore – Vargu i njerëzve nuk kishte të mbaruar.\n" +
        "c)\tMe emër në rasën kallëzore me ose pa parafjalë - Në mbrëmje shijova një gotë verë me miqtë e mi. Kisha kohë pa shijuar një mot me diell.\n" +
        "d)\tMe emër në rasën rrjedhore me ose pa parafjalë -  - Ajo dukej e brishtë si një gotë kristali.  Shtëpia prej guri është e gjyshes sime.\n" +
        "Përcaktori me bashkim\n" +
        "Shprehet:\n" +
        "a) me formë të pashtjelluar pjesore – Dy aktorë mbuluar me pelerina filluan të dialogonin.\n" +
        "b) me formë të pashtjelluar paskajore – Dëshira për të studiuar ishte e ethshme. \n" +
        "c) me ndajfolje – Klasa përballë është e motrës sime.\n";

    if (text.includes("fjalia"))
      return "Fjalia është një grup fjalësh që shpreh një mendim të plotë.";

    return "Mund të më pyesësh për kryefjalën, kallëzuesin, ose përcaktorin 😊";
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    user(text);
    input.value = "";

    if (hapi === 0) {
      if (text.toLowerCase().includes("shqip")) {
        hapi = 1;
        bot("Shkëlqyeshëm 😊 Më thuaj një gjë të mirë dhe një të keqe që të ndodhi sot.");
      } else {
        bot("Të lutem shkruaj: Shqip");
      }
      return;
    }

    if (hapi === 1) {
      if (!eshteNgjarjeSot(text)) {
        bot("Më trego diçka që të ka ndodhur sot 🙂");
        return;
      }
      hapi = 2;
      bot("Faleminderit 🤍 Tani mund të bësh pyetje rreth sintaksës.");
      return;
    }

    if (hapi === 2) {
      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.textContent = "Asistenti Digjital: Duke menduar...";
      messages.appendChild(thinking);

      setTimeout(() => {
        messages.removeChild(thinking);
        bot(pergjigjeSintakse(text));
      }, 1200);
    }
  }
</script>

</body>
</html>
